<!DOCTYPE html>
<html>
<head>

    <title>TMS Debug Map</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body {
            padding: 0;
            margin: 0;
        }
        html, body, #mapid {
            height: 100%;
            width: 100vw;
        }
        .coverage-status { background: white; padding: 8px 12px; border-radius: 4px; box-shadow: 0 1px 5px #777; max-width: min(480px, 70vw); }
    </style>
    <script src="/debug/assets/coverage.js"></script>
</head>
<body>

<div id="mapid"></div>
<script>

    // Network/gateway and initial view can be overridden via query parameters,
    // e.g. /debug/?network_id=...&gateway_id=...&lat=...&lon=...&zoom=12
    const urlParams = new URLSearchParams(window.location.search);
    const networkId = urlParams.get('network_id') || "NS_TTS_V3://ttn@000013";
    const gatewayId = urlParams.get('gateway_id') || "selati-04";
    const numericParam = (name, fallback) => {
        const value = urlParams.has(name) ? Number(urlParams.get(name)) : NaN;
        return Number.isFinite(value) ? value : fallback;
    };
    const lat = numericParam('lat', -23.989572);
    const lon = numericParam('lon', 30.771441);
    const zoom = numericParam('zoom', 12);

    var mymap = L.map('mapid').setView([lat, lon], zoom);

    var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(mymap);

    var popup = L.popup();

    function onMapClick(e) {
        popup
            .setLatLng(e.latlng)
            .setContent("You clicked the map at " + e.latlng.toString())
            .openOn(mymap);
    }

    mymap.on('click', onMapClick);

    var measuredTiles = L.tileLayer('/circles/gateway/{network_id}/{gateway_id}/{z}/{x}/{y}', {
        maxNativeZoom: 19,
        maxZoom: 20,
        zIndex: 10,
        opacity: 0.5,
        network_id: encodeURIComponent(networkId),
        gateway_id: encodeURIComponent(gatewayId)
    });
    measuredTiles.addTo(mymap);

    var measuredNetworkTiles = L.tileLayer('/circles/network/{network_id}/{z}/{x}/{y}', {
        maxNativeZoom: 19,
        maxZoom: 20,
        zIndex: 9,
        opacity: 0.5,
        network_id: encodeURIComponent(networkId)
    });

    var simcovTiles = new SimCovRasterLayer({
        networkId, gatewayId, zIndex: 11, opacity: 0.5
    });
    var simcovNetworkTiles = new SimCovRasterLayer({
        networkId, zIndex: 12, opacity: 0.5
    });

    L.control.layers(null, {
        "Measured coverage (gateway)": measuredTiles,
        "Measured coverage (network)": measuredNetworkTiles,
        "Simulated coverage (gateway)": simcovTiles,
        "Simulated coverage (network)": simcovNetworkTiles
    }, {collapsed: false}).addTo(mymap);

    // Add a link to the comparison graph
    var comparisonLink = L.control({position: 'topright'});
    comparisonLink.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'info');
        div.style.background = "white";
        div.style.padding = "10px";
        div.style.border = "2px solid rgba(0,0,0,0.2)";
        div.style.borderRadius = "4px";
        div.innerHTML = '<a href="/debug/gateway/comparison.html?network_id=' + encodeURIComponent(networkId) + '&gateway_id=' + encodeURIComponent(gatewayId) + '" target="_blank">View Signal vs Distance Graph</a>';
        return div;
    };
    comparisonLink.addTo(mymap);

</script>

</body>
</html>
